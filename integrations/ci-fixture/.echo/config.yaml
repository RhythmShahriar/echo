# Echo settings for the CI fixture: the one-page shop in php/, served with
# php -S 127.0.0.1:20510 php/index.php. Used by the Action's own tests
# (.github/workflows/action-test.yml) and the Windows and macOS CI jobs.
site: http://127.0.0.1:20510
quiet: 1s
timeout: 15s
actions:
  - name: Order form
    http:
      method: POST
      url: /order
      form:
        email: customer@example.com
