# Echo as a GitHub Action. See the wiki page Echo-CI for examples:
# https://github.com/RhythmShahriar/rhythm/wiki/Echo-CI
#
# The bash steps keep their logic in integrations/action (summary.sh for
# the job summary and the pull request comment body, comment.sh to post it)
# and .github/scripts/verify-release.sh; go test ./integrations/action runs
# these steps locally against the CI fixture.
name: Rhythm Echo
description: Is your site still saying what it should? Capture and compare every email, SMS and webhook your site sends, with staging sealed.
author: Rhythm Shahriar
branding:
  icon: radio
  color: orange

inputs:
  mode:
    description: >
      "snapshot", "compare" or "run" start Echo, run the actions in .echo/config.yaml, report and
      stop it. "up" starts Echo in the background for later steps (e.g. rhythm soundcheck --echo)
      and leaves it running; a later step with mode "stop" stops it and reports the latest run.
      "consent" checks cookie consent in a real browser (no choice, Accept and Reject) on the
      pages in site; it doesn't start Echo.
    required: false
    default: run
  working-directory:
    description: >
      Folder to run Echo in: the one with .echo/ (config, snapshots and runs). Relative to the
      workspace, e.g. sites/shop in a monorepo.
    required: false
    default: "."
  site:
    description: >
      For mode consent: the page or pages to check, separated by spaces or new lines. Empty uses
      consent.urls from the config, or --sites in args. Only sites you own or are authorised to test.
    required: false
    default: ""
  config:
    description: Config file, relative to working-directory. Default .echo/config.yaml.
    required: false
    default: ""
  name:
    description: Snapshot name for mode snapshot.
    required: false
    default: ci
  fail-on:
    description: >
      Fail on changes at or above broke, new or changed (compare), or issues at or above error,
      warning or notice (run, snapshot or stop after a run). "none" never fails. Any case. Default,
      as in the CLI: broke when comparing (mode compare, or consent with --against in args), error
      otherwise.
    required: false
    default: ""
  seal:
    description: >
      "true" seals Echo: nothing leaves, Echo answers for every service. "false" observes:
      everything is recorded and sent for real.
    required: false
    default: "true"
  listen:
    description: >
      API address. Use 0.0.0.0:8025 when the site runs in a service container; a token is
      then generated (the token output) and the url output is the runner's address.
    required: false
    default: 127.0.0.1:8025
  smtp:
    description: >
      SMTP sink address, or "off". Use 0.0.0.0:1025 for a site in a service container; it then
      asks for the token as the SMTP password (any username).
    required: false
    default: 127.0.0.1:1025
  args:
    description: >
      Extra flags for the command, split like a shell would (quotes group words) but never run
      through one, e.g. "--action 'Contact form' --verbose", or for mode consent
      "--runs +gpc --geo de --against baseline". --show-ids is refused in mode consent.
    required: false
    default: ""
  version:
    description: >
      Echo version to install, e.g. 1.0.0, or "latest". Default: the Action's own release when it
      is used by a release tag (RhythmShahriar/echo@v1.2.3) or by that tag's commit SHA, otherwise
      the latest release, with a warning. Set it when you pin the Action to a commit no release
      tag points at. Every download is checked against its cosign signature before it runs.
    required: false
    default: ""
  upload:
    description: >
      Upload the HTML and JUnit reports as the echo-report workflow artifact (echo-report-2 and so
      on for later uses of the Action in the same job). Off by default: the
      HTML report holds every captured recipient, subject and body; anyone can download the
      artifacts of a public repository's runs. The Action warns when it is on in a public repository.
      For mode consent: the evidence folder (screenshots of the site, consent.json, reports) as the
      echo-consent artifact (echo-consent-2 and so on).
    required: false
    default: "false"
  sign:
    description: >
      For mode consent: sign consent.json with keyless cosign (consent.json.sigstore.json in the
      evidence folder). Needs "permissions: id-token: write" in the job. The repository and
      workflow name become public in the Rekor transparency log.
    required: false
    default: "false"
  retention-days:
    description: For mode consent with upload, how many days GitHub keeps the echo-consent artifact (1 to 90).
    required: false
    default: "14"
  log:
    description: >
      Upload Echo's log as the echo-log artifact (echo-log-2 and so on for later uses in the same
      job) when the step fails or finds something, masked
      like the summary unless summary-details is true.
    required: false
    default: "true"
  summary-details:
    description: >
      Show recipients, subjects and before and after values in the job summary, the pull request
      comment and the uploaded log. By default they have counts, change titles and action names,
      with addresses, numbers and quoted text masked, because anyone who can read the repository
      can read them.
    required: false
    default: "false"
  pr-comment:
    description: >
      On a pull request, post one comment listing what broke and what is new, updated on every
      later run. Needs "permissions: pull-requests: write" in the job; a pull request from
      a fork gets a read-only token, so the Action warns and carries on.
    required: false
    default: "false"

outputs:
  url:
    description: >
      Echo's API as the site under test reaches it, for its RHYTHM_ECHO_URL: the runner's address
      when listen is 0.0.0.0, so a service container can reach it. Later steps on the runner get
      RHYTHM_ECHO_URL (on loopback) and RHYTHM_ECHO_TOKEN in their environment.
    value: ${{ steps.up.outputs.url }}
  smtp:
    description: The SMTP sink as the site reaches it (host:port), empty when off.
    value: ${{ steps.up.outputs.smtp }}
  token:
    description: The token connectors must send when Echo listens beyond loopback.
    value: ${{ steps.up.outputs.token }}
  exit-code:
    description: >
      The command's exit code: 0 ok, 1 --fail-on hit, 2 usage error (flags or .echo/config.yaml),
      3 couldn't run, 130 interrupted.
    value: ${{ steps.check.outputs.exit-code || steps.consent.outputs.exit-code || steps.up.outputs.exit-code }}
  report:
    description: >
      Path of the standalone HTML report. For mode up, where the later mode stop step writes it.
      For mode consent, report.html in the evidence folder.
    value: ${{ steps.check.outputs.report || steps.consent.outputs.report || steps.up.outputs.report }}
  summary:
    description: Path of a copy of the job summary the Action wrote (Markdown).
    value: ${{ steps.check.outputs.summary || steps.consent.outputs.summary || steps.up.outputs.summary }}
  comment-id:
    description: ID of the pull request comment the Action posted or updated, with pr-comment.
    value: ${{ steps.comment.outputs.id }}
  json:
    description: For mode consent, the path of consent.json in the evidence folder.
    value: ${{ steps.consent.outputs.json }}
  before-choice:
    description: For mode consent, how many tracker hits came before the visitor chose.
    value: ${{ steps.consent.outputs.before-choice }}
  after-reject:
    description: For mode consent, how many tracker hits came after Reject.
    value: ${{ steps.consent.outputs.after-reject }}
  inconclusive:
    description: For mode consent, how many runs couldn't make or confirm their choice.
    value: ${{ steps.consent.outputs.inconclusive }}

runs:
  using: composite
  steps:
    # Each use in a job gets its own summary file and artifact names (the
    # first keeps the plain ones), so mode up then stop, or a snapshot
    # then a compare, can't overwrite each other's or fail the upload.
    - name: Number this use
      id: use
      shell: bash
      run: |
        n=$(( $(cat "$RUNNER_TEMP/echo-uses" 2>/dev/null || echo 0) + 1 ))
        echo "$n" > "$RUNNER_TEMP/echo-uses"
        if [ "$n" -eq 1 ]; then echo "suffix="; else echo "suffix=-$n"; fi >> "$GITHUB_OUTPUT"

    - name: Install cosign
      if: inputs.mode != 'stop'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install Echo
      if: inputs.mode != 'stop'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        VERIFY: ${{ github.action_path }}/.github/scripts/verify-release.sh
        PICK: ${{ github.action_path }}/integrations/action/version.sh
        # Only to look up which release tag a commit SHA is.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # The binary follows the Action: RhythmShahriar/echo@v1.2.3 (or that
        # tag's commit SHA) runs Echo 1.2.3, so a new release can't change a
        # pinned build.
        # Its warning goes to stdout, where the runner reads workflow commands.
        { VERSION=$(bash "$PICK" 2>&3); } 3>&1
        case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) echo "unsupported CPU $(uname -m)"; exit 1 ;; esac
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$os" in linux | darwin) ;; *) echo "::error::the Echo Action runs on Linux and macOS runners, not $(uname -s)"; exit 1 ;; esac
        if [ "$VERSION" = latest ]; then
          # The signature is checked against the release's own tag, so look
          # it up: releases/latest redirects to releases/tag/vX.Y.Z.
          url=$(curl -fsSI -o /dev/null -w '%{redirect_url}' https://github.com/RhythmShahriar/echo/releases/latest)
          VERSION=${url##*/tag/}
          [[ $url == */tag/* && $VERSION =~ ^v[0-9] ]] || { echo "::error::couldn't find Echo's latest release (got '$url')"; exit 1; }
        fi
        base=https://github.com/RhythmShahriar/echo/releases/download/v${VERSION#v}
        dir="$RUNNER_TEMP/echo-bin"
        mkdir -p "$dir" && cd "$dir"
        archive="rhythm-echo_${os}_${arch}.tar.gz"
        for f in "$archive" checksums.txt checksums.txt.sigstore.json; do
          curl -fsSLO "$base/$f"
        done
        bash "$VERIFY" "$dir" "$archive" "$VERSION"
        tar -xzf "$archive" rhythm-echo
        echo "$dir" >> "$GITHUB_PATH"
        ./rhythm-echo --version

    - name: Start Echo
      id: up
      if: inputs.mode != 'stop' && inputs.mode != 'consent'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ inputs.mode }}
        SEAL: ${{ inputs.seal }}
        LISTEN: ${{ inputs.listen }}
        SMTP: ${{ inputs.smtp }}
        CONFIG: ${{ inputs.config }}
        SUMMARY: ${{ github.action_path }}/integrations/action/summary.sh
        USE: ${{ steps.use.outputs.suffix }}
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/echo.log"
        md="$RUNNER_TEMP/echo-summary$USE.md"
        # A report from an earlier Echo step in this job must not reach this
        # step's pull request comment.
        rm -f "$RUNNER_TEMP/echo-report.json"
        # stop writes the summary and exit code of a failed start, so the
        # job summary says why whatever the mode.
        stop() {
          echo "exit-code=$1" >> "$GITHUB_OUTPUT"
          echo "::error::$2"
          printf 'rhythm echo: %s\n' "$2" > "$RUNNER_TEMP/echo-error.txt"
          bash "$SUMMARY" error "$1" "$RUNNER_TEMP/echo-error.txt" "$log" > "$md" || true
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$md" >> "$GITHUB_OUTPUT"
          exit "$1"
        }
        : > "$log"
        case "$MODE" in snapshot|compare|run|up) ;; *) stop 2 "mode must be snapshot, compare, run, up, stop or consent, not \"$MODE\"" ;; esac
        case "$SEAL" in
          true|seal) flag=--seal ;;
          false|observe) flag=--observe ;;
          *) stop 2 "seal must be true or false, not \"$SEAL\"" ;;
        esac
        config=()
        [ -z "$CONFIG" ] || config=(--config "$CONFIG")
        # host_of prints the host of host:port, without IPv6 brackets.
        host_of() { local h=${1%:*}; h=${h#[}; echo "${h%]}"; }
        loopback() { case "$(host_of "$1")" in 127.*|localhost|::1) return 0 ;; *) return 1 ;; esac; }
        token=""
        if ! loopback "$LISTEN" || { [ "$SMTP" != off ] && ! loopback "$SMTP"; }; then
          token=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::add-mask::$token"
        fi
        RHYTHM_ECHO_TOKEN="$token" nohup rhythm-echo up "$flag" --listen "$LISTEN" --smtp "$SMTP" ${config[@]+"${config[@]}"} --plain > "$log" 2>&1 &
        echo $! > "$RUNNER_TEMP/echo.pid"
        # local: how steps on the runner reach Echo. site: how the site does,
        # which for a wildcard listen is the runner's own address.
        runner_ip=$( (hostname -I 2>/dev/null || ipconfig getifaddr en0 2>/dev/null || echo 127.0.0.1) | awk '{print $1}')
        addr() {
          local h port=${1##*:}
          h=$(host_of "$1")
          case "$h" in
            0.0.0.0|::|"") if [ "$2" = local ]; then h=127.0.0.1; else h=$runner_ip; fi ;;
          esac
          case "$h" in *:*) h="[$h]" ;; esac
          echo "$h:$port"
        }
        local_url="http://$(addr "$LISTEN" local)"
        pid=$(cat "$RUNNER_TEMP/echo.pid")
        for _ in $(seq 1 50); do
          curl -fsS -H "X-Echo-Token: $token" "$local_url/v1/health" >/dev/null 2>&1 && break
          # Echo exited (a bad config, a port in use): pass its exit code on.
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0
            wait "$pid" || code=$?
            cat "$log"
            [ "$code" -ge 2 ] || code=3
            stop "$code" "Echo stopped as it started (exit $code); its log is below"
          fi
          sleep 0.2
        done
        if ! curl -fsS -H "X-Echo-Token: $token" "$local_url/v1/health"; then
          cat "$log"
          stop 3 "Echo didn't start at $local_url"
        fi
        echo
        {
          echo "url=http://$(addr "$LISTEN" site)"
          if [ "$SMTP" = off ]; then echo "smtp="; else echo "smtp=$(addr "$SMTP" site)"; fi
          echo "token=$token"
        } >> "$GITHUB_OUTPUT"
        echo "RHYTHM_ECHO_URL=$local_url" >> "$GITHUB_ENV"
        [ -z "$token" ] || echo "RHYTHM_ECHO_TOKEN=$token" >> "$GITHUB_ENV"
        if [ "$MODE" = up ]; then
          printf '## ♪ Echo\n\nEcho is running at %s (%s). A later step with `mode: stop` stops it and reports the latest run.\n' "$local_url" "${flag#--}" > "$md"
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary=$md"
            echo "report=$RUNNER_TEMP/echo-report/echo-report.html"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Run Echo
      id: check
      if: inputs.mode != 'up' && inputs.mode != 'consent'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
        UPLOAD: ${{ inputs.upload }}
        DETAILS: ${{ inputs.summary-details }}
        PRIVATE: ${{ github.event.repository.private }}
        SUMMARY: ${{ github.action_path }}/integrations/action/summary.sh
        USE: ${{ steps.use.outputs.suffix }}
      run: |
        # The runner starts bash with -e; this step reads exit codes itself.
        set +e -uo pipefail
        out="$RUNNER_TEMP/echo-report"
        md="$RUNNER_TEMP/echo-summary$USE.md"
        json="$RUNNER_TEMP/echo-report.json"
        errf="$RUNNER_TEMP/echo-error.txt"
        outf="$RUNNER_TEMP/echo-output.txt"
        mkdir -p "$out"
        rm -f "$json"
        : > "$errf"
        # finish writes the summary of a command that couldn't run (exit 2
        # and up) and exits with its code.
        finish() {
          echo "exit-code=$1" >> "$GITHUB_OUTPUT"
          bash "$SUMMARY" error "$1" "$errf" "$RUNNER_TEMP/echo.log" > "$md" || true
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$md" >> "$GITHUB_OUTPUT"
          exit "$1"
        }
        usage() {
          printf 'rhythm echo: %s\n' "$1" | tee "$errf" >&2
          echo "::error::$1"
          finish 2
        }

        compared=false
        [ "$MODE" = compare ] && compared=true
        if [ "$MODE" = stop ]; then
          # Stop Echo first, so the log is complete and nothing more arrives.
          if [ -f "$RUNNER_TEMP/echo.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/echo.pid")
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 50); do kill -0 "$pid" 2>/dev/null || break; sleep 0.1; done
            rm -f "$RUNNER_TEMP/echo.pid"
          else
            echo "::warning::No Echo to stop: run the Action with mode up first."
          fi
          if ! rhythm-echo report --json -o "$json" -q >/dev/null 2>&1; then
            printf '## ♪ Echo\n\nEcho stopped. There was no run in %s to report.\n' "$PWD" > "$md"
            cat "$md" >> "$GITHUB_STEP_SUMMARY"
            { echo "exit-code=0"; echo "summary=$md"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Echo's JSON envelope names its kind; an older Echo's plain
          # comparison is known by its changes.
          jq -e '.kind == "comparison" or has("changes")' "$json" >/dev/null && compared=true
        fi

        # One --fail-on vocabulary, as in the CLI: any case is fine and none
        # never fails. The default is broke when comparing, else error.
        level=$(printf '%s' "$FAIL_ON" | tr '[:upper:]' '[:lower:]')
        if [ "$compared" = true ]; then
          case "$level" in
            "") level=broke ;;
            none|broke|new|changed) ;;
            *) usage "fail-on \"$FAIL_ON\": want none, broke, new or changed when comparing" ;;
          esac
        else
          case "$level" in
            "") level=error ;;
            none|error|warning|notice) ;;
            *) usage "fail-on \"$FAIL_ON\": want none, error, warning or notice (or broke, new, changed when comparing)" ;;
          esac
        fi
        fail=()
        [ "$level" = none ] || fail=(--fail-on "$level")
        config=()
        [ -z "$CONFIG" ] || config=(--config "$CONFIG")
        # Split ARGS like a shell (quotes group words) without running it:
        # xargs only parses quotes. Its output is taken first, so a quote
        # left open is a usage error instead of silently dropping the flags.
        extra=()
        if [ -n "$ARGS" ]; then
          words=$(printf '%s' "$ARGS" | xargs -n1 printf '%s\n' 2>/dev/null) ||
            usage "args: a quote isn't closed; put words with spaces in matching ' or \" quotes"
          [ -z "$words" ] || while IFS= read -r a; do extra+=("$a"); done <<< "$words"
        fi
        which=()
        case "$MODE" in
          snapshot) cmd=(rhythm-echo snapshot --name "$NAME"); which=("$NAME") ;;
          compare)  cmd=(rhythm-echo compare) ;;
          run)      cmd=(rhythm-echo run) ;;
          stop)     cmd=(rhythm-echo report) ;;
          *) usage "mode must be snapshot, compare, run, up, stop or consent, not \"$MODE\"" ;;
        esac
        [ "$MODE" = stop ] || cmd+=(${config[@]+"${config[@]}"})
        # stderr goes to a file for the summary, then to the step log.
        # stdout names recipients, phone numbers and the text of messages
        # and anyone can read a public repository's step log, so it goes to
        # the log only with summary-details: true; otherwise the masked
        # summary is printed there below.
        "${cmd[@]}" ${fail[@]+"${fail[@]}"} ${extra[@]+"${extra[@]}"} --plain > "$outf" 2> "$errf"
        code=$?
        [ "$DETAILS" = true ] && cat "$outf"
        cat "$errf" >&2
        # Without --fail-on the CLI still exits 1 on a failed action or at
        # its default level. none never fails; Echo 1.0.0 refuses
        # --fail-on none, so it isn't passed.
        [ "$level" = none ] && [ "$code" -eq 1 ] && code=0
        [ "$code" -ge 2 ] && finish "$code"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        # The summary is masked unless summary-details: true. A copy stays
        # outside the uploaded folder for the summary output; so does the JSON
        # for the pull request comment.
        # The reports written to files below print the unmasked results on
        # stdout too, which must stay out of the step log.
        rhythm-echo report ${which[@]+"${which[@]}"} --json -o "$json" -q > /dev/null || true
        if [ "$DETAILS" = true ]; then
          rhythm-echo report ${which[@]+"${which[@]}"} --md > "$md" || true
        elif [ -s "$json" ]; then
          bash "$SUMMARY" report "$json" > "$md" || true
        fi
        [ -s "$md" ] || printf '## ♪ Echo\n\nThe report could not be written; see the step log.\n' > "$md"
        cat "$md" >> "$GITHUB_STEP_SUMMARY"
        [ "$DETAILS" = true ] || cat "$md"
        echo "summary=$md" >> "$GITHUB_OUTPUT"
        if [ "$UPLOAD" = true ] && [ "$PRIVATE" = false ]; then
          echo "::warning::upload is on in a public repository: anyone can download the echo-report artifact, with every captured recipient, subject and message. Turn upload off, or keep the repository private."
        fi
        rhythm-echo report ${which[@]+"${which[@]}"} ${fail[@]+"${fail[@]}"} --junit -o "$out/echo-junit.xml" -q > /dev/null || true
        rhythm-echo report ${which[@]+"${which[@]}"} --html -o "$out/echo-report.html" -q > /dev/null || true
        echo "report=$out/echo-report.html" >> "$GITHUB_OUTPUT"
        exit 0

    # mode consent: no Echo server, a browser instead. Every input reaches
    # the script through env, never through ${{ }} inside run:, so a site
    # or an argument can't become shell.
    - name: Check consent
      id: consent
      if: inputs.mode == 'consent'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SITE: ${{ inputs.site }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
        UPLOAD: ${{ inputs.upload }}
        RETENTION: ${{ inputs.retention-days }}
        DETAILS: ${{ inputs.summary-details }}
        PRIVATE: ${{ github.event.repository.private }}
        SUMMARY: ${{ github.action_path }}/integrations/action/summary.sh
        USE: ${{ steps.use.outputs.suffix }}
      run: |
        # The runner starts bash with -e; this step reads exit codes itself.
        set +e -uo pipefail
        md="$RUNNER_TEMP/echo-summary$USE.md"
        json="$RUNNER_TEMP/echo-consent.json"
        report="$RUNNER_TEMP/echo-consent.md"
        errf="$RUNNER_TEMP/echo-error.txt"
        outf="$RUNNER_TEMP/echo-output.txt"
        rm -f "$json" "$report" "$RUNNER_TEMP/echo-report.json"
        : > "$errf"
        # finish writes the summary of a check that couldn't run and exits
        # with its code.
        finish() {
          echo "exit-code=$1" >> "$GITHUB_OUTPUT"
          bash "$SUMMARY" error "$1" "$errf" /dev/null > "$md" || true
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$md" >> "$GITHUB_OUTPUT"
          exit "$1"
        }
        usage() {
          printf 'rhythm echo: %s\n' "$1" | tee "$errf" >&2
          echo "::error::$1"
          finish 2
        }
        # split prints its argument's words one per line, like a shell
        # would split them (quotes group words) without running one: xargs
        # only parses quotes. $(...) and backticks stay plain text.
        split() {
          [ -z "$1" ] || printf '%s' "$1" | xargs -n1 printf '%s\n' 2>/dev/null
        }
        quote="a quote isn't closed; put words with spaces in matching ' or \" quotes"
        extra=()
        words=$(split "$ARGS") || usage "args: $quote"
        [ -z "$words" ] || while IFS= read -r a; do extra+=("$a"); done <<< "$words"
        sites=()
        words=$(split "$SITE") || usage "site: $quote"
        [ -z "$words" ] || while IFS= read -r a; do sites+=("$a"); done <<< "$words"
        compared=false
        for a in ${extra[@]+"${extra[@]}"}; do
          case "$a" in
            --show-ids|--show-ids=*|-show-ids|-show-ids=*) usage "Echo: --show-ids is not allowed in the Action: its output is shared" ;;
            --against|--against=*|-against|-against=*) compared=true ;;
          esac
        done
        case "$RETENTION" in
          [1-9]|[1-8][0-9]|90) ;;
          *) usage "retention-days \"$RETENTION\": want a number of days from 1 to 90" ;;
        esac
        level=$(printf '%s' "$FAIL_ON" | tr '[:upper:]' '[:lower:]')
        if [ "$compared" = true ]; then
          case "$level" in
            "") level=broke ;;
            none|broke|new|changed) ;;
            *) usage "fail-on \"$FAIL_ON\": want none, broke, new or changed with --against" ;;
          esac
        else
          case "$level" in
            "") level=error ;;
            none|error|warning|notice) ;;
            *) usage "fail-on \"$FAIL_ON\": want none, error, warning or notice (or broke, new, changed with --against)" ;;
          esac
        fi
        echo "fail-on=$level" >> "$GITHUB_OUTPUT"
        config=()
        [ -z "$CONFIG" ] || config=(--config "$CONFIG")
        verbose=()
        [ "$DETAILS" = true ] && verbose=(-v)
        # The pages go after --, so one spelled like a flag stays a page.
        end=()
        [ ${#sites[@]} -eq 0 ] || end=(-- "${sites[@]}")
        # stdout names every page and hit; the step log is as public as
        # the summary, so it goes there only with summary-details: true.
        rhythm-echo consent -o "$json" -o "$report" ${config[@]+"${config[@]}"} ${verbose[@]+"${verbose[@]}"} \
          ${extra[@]+"${extra[@]}"} --fail-on "$level" --plain ${end[@]+"${end[@]}"} > "$outf" 2> "$errf"
        code=$?
        [ "$DETAILS" = true ] && cat "$outf"
        cat "$errf" >&2
        # Exit 3 with a result is a check with runs that couldn't choose:
        # it has a summary to show. Without one it couldn't run at all.
        if [ "$code" -ge 2 ] && { [ "$code" -ne 3 ] || [ ! -s "$json" ]; }; then
          finish "$code"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -s "$json" ]; then
          bash "$SUMMARY" consent "$json" "$report" > "$md" || true
          # before-choice, after-reject, inconclusive, folder; a count the
          # summary leaves out reads as 0.
          counts=$(bash "$SUMMARY" consent-outputs "$json") || counts=""
          folder=$(printf '%s\n' "$counts" | sed -n 's/^folder=//p')
          printf '%s\n' "$counts" | grep -E '^(before-choice|after-reject|inconclusive)=[0-9]+$' >> "$GITHUB_OUTPUT"
          if [ -n "$folder" ]; then
            case "$folder" in /*) ;; *) folder="$PWD/$folder" ;; esac
            {
              echo "folder=$folder"
              echo "json=$folder/consent.json"
              echo "report=$folder/report.html"
            } >> "$GITHUB_OUTPUT"
          fi
        fi
        [ -s "$md" ] || printf '## ♪ Echo consent\n\nThe report could not be written; see the step log.\n' > "$md"
        cat "$md" >> "$GITHUB_STEP_SUMMARY"
        [ "$DETAILS" = true ] || cat "$md"
        echo "summary=$md" >> "$GITHUB_OUTPUT"
        if [ "$UPLOAD" = true ] && [ "$PRIVATE" = false ]; then
          echo "::warning::upload is on in a public repository: anyone can download the echo-consent artifact, with screenshots of the site and every page checked. Turn upload off, or keep the repository private."
        fi
        exit 0

    - name: Sign consent.json
      if: inputs.mode == 'consent' && inputs.sign == 'true' && steps.consent.outputs.folder != ''
      shell: bash
      env:
        FOLDER: ${{ steps.consent.outputs.folder }}
      run: |
        set -euo pipefail
        echo "::notice::Signing consent.json with keyless cosign: the repository and workflow name go to the public Rekor transparency log."
        cd "$FOLDER"
        cosign sign-blob --yes --bundle consent.json.sigstore.json consent.json

    - name: Stop Echo
      # Not after consent either: an Echo an earlier mode up step started
      # (for --echo) keeps running for the steps after this one.
      if: always() && inputs.mode != 'up' && inputs.mode != 'stop' && inputs.mode != 'consent'
      shell: bash
      run: |
        [ -f "$RUNNER_TEMP/echo.pid" ] && kill "$(cat "$RUNNER_TEMP/echo.pid")" 2>/dev/null || true

    - name: Upload reports
      if: always() && inputs.mode != 'up' && inputs.upload == 'true' && steps.check.outputs.report != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: echo-report${{ steps.use.outputs.suffix }}
        path: ${{ runner.temp }}/echo-report/
        if-no-files-found: ignore
        # Matrix jobs share the run's artifact names: the last one wins
        # instead of failing the step.
        overwrite: true

    - name: Upload the evidence
      if: always() && inputs.mode == 'consent' && inputs.upload == 'true' && steps.consent.outputs.folder != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: echo-consent${{ steps.use.outputs.suffix }}
        path: ${{ steps.consent.outputs.folder }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Prepare the log
      id: log
      if: always() && inputs.log == 'true' && (failure() || (steps.check.outputs.exit-code != '' && steps.check.outputs.exit-code != '0'))
      shell: bash
      env:
        DETAILS: ${{ inputs.summary-details }}
        SUMMARY: ${{ github.action_path }}/integrations/action/summary.sh
      run: |
        [ -f "$RUNNER_TEMP/echo.log" ] || exit 0
        mkdir -p "$RUNNER_TEMP/echo-log"
        if [ "$DETAILS" = true ]; then
          cp "$RUNNER_TEMP/echo.log" "$RUNNER_TEMP/echo-log/echo.log"
        else
          bash "$SUMMARY" mask < "$RUNNER_TEMP/echo.log" > "$RUNNER_TEMP/echo-log/echo.log"
        fi
        echo "path=$RUNNER_TEMP/echo-log/echo.log" >> "$GITHUB_OUTPUT"

    - name: Upload the log
      if: always() && steps.log.outputs.path != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: echo-log${{ steps.use.outputs.suffix }}
        path: ${{ steps.log.outputs.path }}
        if-no-files-found: ignore
        overwrite: true

    - name: Comment on the pull request
      id: comment
      if: always() && inputs.pr-comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        KEY: ${{ inputs.working-directory }}
        CODE: ${{ steps.check.outputs.exit-code || steps.consent.outputs.exit-code || steps.up.outputs.exit-code }}
        MODE: ${{ inputs.mode }}
        CONSENT: ${{ steps.consent.outputs.summary }}
        DETAILS: ${{ inputs.summary-details }}
        SUMMARY: ${{ github.action_path }}/integrations/action/summary.sh
        COMMENT: ${{ github.action_path }}/integrations/action/comment.sh
      run: |
        body="$RUNNER_TEMP/echo-comment.md"
        details=()
        [ "$DETAILS" = true ] && details=(--details)
        if [ "$MODE" = consent ]; then
          # The consent summary is the comment, masked the same way.
          [ -s "$CONSENT" ] || exit 0
          cp "$CONSENT" "$body"
        elif [ -n "$CODE" ] && [ "$CODE" -ge 2 ]; then
          bash "$SUMMARY" error "$CODE" "$RUNNER_TEMP/echo-error.txt" /dev/null > "$body"
        elif [ -s "$RUNNER_TEMP/echo-report.json" ]; then
          bash "$SUMMARY" comment ${details[@]+"${details[@]}"} "$RUNNER_TEMP/echo-report.json" > "$body"
        else
          exit 0
        fi
        bash "$COMMENT" "$body"

    - name: Fail on changes
      if: steps.check.outputs.exit-code == '1'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::Echo found changes or issues at or above --fail-on ${FAIL_ON:-its default}. See the job summary."
        exit 1

    - name: Fail on consent issues
      # Exit 3 with a result: runs that couldn't choose (a check that
      # couldn't run at all failed its own step).
      if: steps.consent.outputs.exit-code == '1' || (steps.consent.outputs.exit-code == '3' && steps.consent.outputs.inconclusive != '')
      shell: bash
      env:
        CODE: ${{ steps.consent.outputs.exit-code }}
        LEVEL: ${{ steps.consent.outputs.fail-on }}
        RUNS: ${{ steps.consent.outputs.inconclusive }}
      run: |
        if [ "$CODE" = 3 ]; then
          echo "::error::Echo couldn't check consent on ${RUNS:-0} runs (see the summary)"
          exit 3
        fi
        echo "::error::Echo found consent issues at or above --fail-on $LEVEL"
        exit 1
