; The legacy order page's PHP settings. mail() hands messages to Echo's
; sendmail shim (RHYTHM_ECHO_SMTP in the container's environment says where
; Echo's SMTP sink is) and errors are displayed, as on many old hosts.
sendmail_path = "/usr/local/bin/rhythm-echo sendmail -t -i"
display_errors = On
html_errors = Off
error_reporting = E_ALL
