# The consent testbed's gate: every name the runner asks for resolves
# here (dns), so this is where TLS ends, with one certificate from the
# testbed CA that covers every site and stand-in host
# (runtime/gate/gate.pem, written by make up). Requests go on by Host:
# the WordPress variants (*-wp.shop.test) to wp, the other scenario
# sites to shop, everything else (the tracker and CMP hosts) to tags.
# A name neither serves is answered 421 by tags and counted as unmapped.

worker_processes 1;
events { worker_connections 1024; }

http {
    access_log off;
    server_names_hash_bucket_size 128;
    client_max_body_size 64m;

    # Names are looked up per request through Docker's resolver, never
    # once at start: a static upstream makes nginx refuse to start while
    # a service (wp waits for db) isn't up yet. A missing service is a
    # 502 for its hosts and the gate stays up for the rest.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $host $site {
        ~^[a-z0-9-]+-wp\.shop\.test$ wp:80;
        ~(^|\.)shop\.test$ shop:8080;
        default tags:8080;
    }

    # A variant's own files that WordPress doesn't have (the Partytown
    # stand-in of c14) come from its scenario's Go site.
    map $host $basehost {
        ~^(?<base>[a-z0-9]+)-wp\.shop\.test$ $base.shop.test;
        default $host;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;

    server {
        listen 443 ssl default_server;
        ssl_certificate /certs/gate.pem;
        ssl_certificate_key /certs/gate-key.pem;
        location / { proxy_pass http://$site; }
        location /~partytown/ { proxy_set_header Host $basehost; set $shop_up shop:8080; proxy_pass http://$shop_up; }
    }

    # e12's fixture: a certificate the testbed CA didn't sign.
    server {
        listen 443 ssl;
        server_name self-signed.shop.test;
        ssl_certificate /certs/self-signed.pem;
        ssl_certificate_key /certs/self-signed-key.pem;
        location / { set $shop_up shop:8080; proxy_pass http://$shop_up; }
    }

    server {
        listen 80 default_server;
        location / { proxy_pass http://$site; }
        location /~partytown/ { proxy_set_header Host $basehost; set $shop_up shop:8080; proxy_pass http://$shop_up; }
    }

    # Published on 127.0.0.1 only (docker-compose.yml): the sinks and
    # state endpoints for the benchmark, Echo's API and a health check.
    server { listen 18951; location / { set $up tags:8081; proxy_pass http://$up; } }
    server { listen 18952; location / { set $up shop:8081; proxy_pass http://$up; } }
    server { listen 18953; location / { set $up echo:8025; proxy_pass http://$up; } }
    server { listen 18959; location / { return 200 "ok\n"; } }
}
