# The testbed's gate: the only container on both networks.
#
# - In: the sites and Mailpit, published on 127.0.0.1 (see docker-compose.yml).
#   X-Echo-Run passes through untouched, so Echo can tie what a site sends
#   to the action that caused it.
# - Out: only Echo's ports, forwarded to the Echo on the host. Nothing else
#   on the sealed network has a route anywhere.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 256;
}

http {
	access_log off;
	client_max_body_size 32m;
	resolver 127.0.0.11 valid=10s ipv6=off;
	proxy_http_version 1.1;
	proxy_read_timeout 120s;
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header Connection "";

	server {
		listen 18850;
		location / {
			set $up http://wp:80;
			proxy_pass $up;
		}
	}
	server {
		listen 18851;
		location / {
			set $up http://laravel:8000;
			proxy_pass $up;
		}
	}
	server {
		listen 18852;
		location / {
			set $up http://next:3000;
			proxy_pass $up;
		}
	}
	server {
		listen 18853;
		location / {
			set $up http://php:80;
			proxy_pass $up;
		}
	}
	server {
		listen 18854;
		location / {
			set $up http://mailpit:8025;
			proxy_pass $up;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
	}
	# The shop's CRM, for the order webhooks (sealed network only: not published).
	server {
		listen 18856;
		location / {
			set $up http://crm:80;
			proxy_pass $up;
		}
	}
	# Health check for compose.
	server {
		listen 127.0.0.1:18899;
		location / {
			return 200 "ok\n";
		}
	}
}

stream {
	resolver 127.0.0.11 valid=10s ipv6=off;

	# Echo on the host: API, SMTP sink, HTTP(S) proxy.
	server {
		listen 18860;
		proxy_pass host.docker.internal:18860;
	}
	server {
		listen 18861;
		proxy_pass host.docker.internal:18861;
	}
	server {
		listen 18862;
		proxy_pass host.docker.internal:18862;
	}

	# Mailpit's SMTP, for the benchmark on the host.
	server {
		listen 18855;
		set $mailpit mailpit:1025;
		proxy_pass $mailpit;
	}
}
