# Publishes the Node connector (connectors/node) to npm as @rhythmsh/echo
# when a version tag is pushed, with provenance. It uses the NPM_TOKEN
# repository secret (an npm granular token with write access) when there is
# one. Without it, npm publishes through Trusted Publishing (OIDC, npm
# 11.5.1 or later), once the package is linked to this workflow on
# npmjs.com; then delete the secret.
name: npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # npm provenance and Trusted Publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectors/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # --ignore-scripts: no dependency's install script runs in the job
      # that can publish.
      - run: npm ci --ignore-scripts
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac   # v1.1.0-rc1 → next, never latest
          # setup-node points .npmrc at NODE_AUTH_TOKEN. Set it only from a
          # real secret: an empty or placeholder token would stop npm from
          # falling back to Trusted Publishing.
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN=$NPM_TOKEN
          else
            unset NODE_AUTH_TOKEN
            echo "No NPM_TOKEN secret: publishing with Trusted Publishing."
          fi
          npm publish --provenance --access public --tag "$tag"
