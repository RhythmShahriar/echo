name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  # The shared workflows are pinned by commit; Dependabot can't bump a
  # branch, so move the SHA by hand when RhythmShahriar/.github changes.
  # go runs vet and go test -race ./... on Linux, Windows and macOS.
  go:
    uses: RhythmShahriar/.github/.github/workflows/ci-go.yml@fb09694450362b6d4b68c631182d78a69b653c83 # master
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
  commitlint:
    uses: RhythmShahriar/.github/.github/workflows/commitlint.yml@fb09694450362b6d4b68c631182d78a69b653c83 # master
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        # rhysd/actionlint:1.7.7, by digest so a moved tag can't change the check.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        # koalaman/shellcheck:v0.10.0, by digest so a moved tag can't change the check.
        run: |
          mapfile -t files < <(.github/scripts/shell-files.sh)
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo \
            koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb "${files[@]}"

  # The connectors' own suites, on every pull request (go test doesn't run them).
  connectors-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: connectors/node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: connectors/node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  connectors-laravel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ["8.2", "8.3"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: connectors/laravel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      # The package Makefile runs PHP and Composer in Docker; on the runner
      # they run natively (what make install phpunit analyse runs), so the
      # matrix picks the PHP version and Windows needs no make.
      - run: composer install --no-interaction --no-progress
      - run: php vendor/bin/phpunit
      - if: matrix.php == '8.3'
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

  # The CI fixture's real snapshot and compare under php -S
  # (integrations/ci-fixture) and the Action's own test, with PHP set up
  # on every OS (the go job's runners may not have it).
  integrations-php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.3"
          coverage: none
      - run: go test ./integrations/...

  # The container image: build it from the Dockerfile, send a mail over
  # SMTP and check the Mailpit API answers in Mailpit's shape.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Pull the base image
        run: docker pull -q "$(awk '/^FROM /{print $2; exit}' Dockerfile)"
      - run: go test -tags docker -v ./integrations/image

  # The DDEV add-on, with DDEV's own add-on test action and an image built
  # from this commit (the published one may not have the change yet).
  ddev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build the image
        run: |
          mkdir -p "$RUNNER_TEMP/ctx/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/ctx/linux/amd64/rhythm-echo" ./cmd/rhythm-echo
          docker buildx build --load --platform linux/amd64 -t rhythm-echo:ci -f Dockerfile "$RUNNER_TEMP/ctx"
      # The add-on runs the image with its default CMD, so every flag in
      # it must be one this Echo's up has, as the release's images job
      # also checks.
      - name: Check the default CMD against this Echo
        run: .github/scripts/check-image-cmd.sh "$RUNNER_TEMP/ctx/linux/amd64/rhythm-echo" Dockerfile
      - name: Test the add-on
        uses: ddev/github-action-add-on-test@d614651ba8fffdb956ab7864f191c32353330d68 # v2.6.2
        env:
          ECHO_TEST_IMAGE: rhythm-echo:ci
        with:
          ddev_version: stable
          token: ${{ secrets.GITHUB_TOKEN }}
          addon_repository: ${{ github.repository }}
          addon_ref: ${{ github.sha }}
          disable_checkout_action: true
          test_command: bats integrations/ddev/tests --filter-tags '!release'
