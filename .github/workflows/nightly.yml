# The slow suites, every night and on demand: the Docker tests (a sealed
# container network, PHP's mail() through rhythm-echo sendmail plus the
# WordPress connector inside a real WordPress), PHPStan with the WordPress
# stubs on the mu-plugin and Echo Staging Seal, the Node and Laravel
# connectors end to end against Echo's conformance stand-in, WordPress's
# Plugin Check on the mu-plugin and the consent checks: the benchmark in
# the sealed consent testbed, the consent fuzz targets and the tests with
# every consent stage required on three OSes.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The tests skip when an image is missing; pull them so they run.
      - name: Pull the test images
        run: for i in php:8.3-cli nginx:1.27-alpine alpine:3.20 "$(awk '/^FROM /{print $2; exit}' Dockerfile)"; do docker pull -q "$i"; done
      - run: go test -tags docker -timeout 20m ./...

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # In a folder of its own: the connector ships no composer.json.
      - name: Install PHPStan with the WordPress stubs
        working-directory: ${{ runner.temp }}
        run: |
          mkdir phpstan && cd phpstan
          composer init --no-interaction --name=rhythmsh/echo-phpstan
          composer config allow-plugins.phpstan/extension-installer true
          composer require --no-interaction --no-progress phpstan/phpstan:^2.1 szepeviktor/phpstan-wordpress:^2.0 phpstan/extension-installer:^1.4
      # TestPHPStan and TestPluginPHPStan skip without ECHO_PHPSTAN; a skip
      # here means the install above didn't work, so it fails the job.
      - name: PHPStan on the mu-plugin and Echo Staging Seal
        env:
          ECHO_PHPSTAN: ${{ runner.temp }}/phpstan/vendor/bin/phpstan
        run: |
          go test -run PHPStan -v ./connectors/wordpress/ | tee "$RUNNER_TEMP/phpstan.txt"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/phpstan.txt"; then echo "::error::the PHPStan tests skipped"; exit 1; fi

  # The connectors in real apps against the conformance stand-in, which
  # checks every capture against the wire schema (connectors K10).
  connectors-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Node, in a Next.js app
        working-directory: connectors/node
        run: |
          npm ci --no-audit --no-fund
          npm run test:e2e
      - name: Laravel, in a Laravel app
        run: |
          docker pull -q php:8.3-cli
          connectors/laravel/fixtures/e2e.sh

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The connector is a single-file mu-plugin next to Go code and test
      # data; check it on its own, as rhythm-echo install wordpress ships it.
      - name: Stage the plugin
        run: mkdir -p _plugin/rhythm-echo && cp connectors/wordpress/echo.php _plugin/rhythm-echo/rhythm-echo.php
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: _plugin/rhythm-echo
          slug: rhythm-echo
          # An mu-plugin installed by the CLI has no readme.txt.
          exclude-checks: plugin_readme

  # The consent benchmark of record (PRD 18.2) in the sealed Docker
  # testbed, then make reproduce: two more full runs whose outcomes must
  # match. The benchmark exits 1 when any target is missed, which fails
  # the job; the scoreboard is uploaded either way.
  consent-testbed:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start the sealed consent testbed
        run: make -C testbed/consent up
      - name: Benchmark
        run: make bench-consent
      - name: Reproduce
        run: make -C testbed/consent reproduce
      - name: Upload the scoreboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-consent
          path: |
            docs/benchmark-consent.md
            testbed/consent/bench/work/results.json
          if-no-files-found: warn
      - name: Stop the testbed
        if: always()
        run: make -C testbed/consent down

  # Every consent fuzz target for two minutes each. A crasher lands in its
  # package's testdata/fuzz folder; upload those so it can be replayed.
  consent-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz-consent FUZZTIME=2m
      # The testbed's own parsers: its scenario file and its resolver's
      # answers to whatever a query holds.
      - name: Fuzz the testbed
        run: |
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 2m ./testbed/consent/scenarios
          go test -run '^$' -fuzz '^FuzzRespond$' -fuzztime 2m ./testbed/consent/dns
      - name: Upload the crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consent-fuzz-crashers
          path: |
            consent/**/testdata/fuzz/
            report/testdata/fuzz/
            testbed/consent/**/testdata/fuzz/
          if-no-files-found: ignore

  # The tests with every consent stage required: a stage that isn't
  # linked into the build fails here instead of skipping, on every OS
  # the release ships for.
  consent-integrated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ECHO_CONSENT_REQUIRE_LINKED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-integrated
      - run: make test-browser
