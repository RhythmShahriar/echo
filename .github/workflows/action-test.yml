# Runs the Action (uses: ./) the way a user's workflow does, against the
# current Echo release.
name: action-test
on:
  pull_request:
    paths: [action.yml, .github/scripts/**, .github/workflows/action-test.yml, integrations/**]
  push:
    branches: [master]
    paths: [action.yml, .github/scripts/**, .github/workflows/action-test.yml, integrations/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The Action installs and verifies the release, then starts Echo.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        id: echo
        with:
          mode: up
      - name: Echo answers
        run: |
          rhythm-echo --version
          curl -fsS "$RHYTHM_ECHO_URL/v1/health"
      - uses: ./
        with:
          mode: stop
      - name: Echo stopped
        run: |
          if curl -fsS "$RHYTHM_ECHO_URL/v1/health"; then echo "::error::Echo still runs"; exit 1; fi

  # A release whose checksums.txt or archive changed after signing must
  # never install.
  tampered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the latest release
        run: |
          mkdir -p "$RUNNER_TEMP/rel" && cd "$RUNNER_TEMP/rel"
          url=$(curl -fsSI -o /dev/null -w '%{redirect_url}' https://github.com/RhythmShahriar/echo/releases/latest)
          tag=${url##*/tag/}
          echo "TAG=$tag" >> "$GITHUB_ENV"
          for f in rhythm-echo_linux_amd64.tar.gz checksums.txt checksums.txt.sigstore.json; do
            curl -fsSLO "https://github.com/RhythmShahriar/echo/releases/download/$tag/$f"
          done
      - name: The untouched release verifies
        run: bash .github/scripts/verify-release.sh "$RUNNER_TEMP/rel" rhythm-echo_linux_amd64.tar.gz "$TAG"
      - name: A changed checksums.txt fails
        run: |
          d="$RUNNER_TEMP/sums" && cp -r "$RUNNER_TEMP/rel" "$d"
          # Point the archive's line at a different archive's hash, as an
          # attacker who replaced both files would.
          sum=$(sha256sum /bin/sh | awk '{print $1}')
          awk -v s="$sum" '$2 == "rhythm-echo_linux_amd64.tar.gz" {$1 = s} {print}' "$RUNNER_TEMP/rel/checksums.txt" > "$d/checksums.txt"
          cmp -s "$RUNNER_TEMP/rel/checksums.txt" "$d/checksums.txt" && { echo "::error::the line to change is missing"; exit 1; }
          if bash .github/scripts/verify-release.sh "$d" rhythm-echo_linux_amd64.tar.gz "$TAG"; then
            echo "::error::a tampered checksums.txt verified"; exit 1
          fi
      - name: A changed archive fails
        run: |
          d="$RUNNER_TEMP/archive" && cp -r "$RUNNER_TEMP/rel" "$d"
          printf 'x' >> "$d/rhythm-echo_linux_amd64.tar.gz"
          if bash .github/scripts/verify-release.sh "$d" rhythm-echo_linux_amd64.tar.gz "$TAG"; then
            echo "::error::a tampered archive verified"; exit 1
          fi
      - name: Another release's signature fails
        run: |
          # The files are the latest release's, so its signature can't
          # vouch for them as v0.0.0, which was never released.
          if bash .github/scripts/verify-release.sh "$RUNNER_TEMP/rel" rhythm-echo_linux_amd64.tar.gz v0.0.0; then
            echo "::error::a signature verified for the wrong version"; exit 1
          fi
      - name: A missing signature fails
        run: |
          d="$RUNNER_TEMP/nosig" && cp -r "$RUNNER_TEMP/rel" "$d"
          rm "$d/checksums.txt.sigstore.json"
          if bash .github/scripts/verify-release.sh "$d" rhythm-echo_linux_amd64.tar.gz "$TAG"; then
            echo "::error::a release without a signature verified"; exit 1
          fi

  # Upload is off by default and the summary hides who was messaged and
  # what was said, unless summary-details is on.
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # list this run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the fixture shop
        run: php -S 127.0.0.1:20510 integrations/ci-fixture/php/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
      - uses: ./
        with:
          mode: snapshot
          name: good
          working-directory: integrations/ci-fixture
      - run: touch integrations/ci-fixture/php/broken
      - uses: ./
        id: masked
        with:
          mode: compare
          fail-on: none
          working-directory: integrations/ci-fixture
      - name: The summary is masked
        env:
          SUMMARY: ${{ steps.masked.outputs.summary }}
        run: |
          cat "$SUMMARY"
          grep -F '**Something broke.**' "$SUMMARY"
          grep -F '| 1 | 1 | 0 | 0 |' "$SUMMARY"
          grep -F 'summary-details: true' "$SUMMARY"
          for private in customer@example.com 'Order W-1001 received' 'New order W-1001'; do
            if grep -F "$private" "$SUMMARY"; then echo "::error::the summary shows $private"; exit 1; fi
          done
      - uses: ./
        id: details
        with:
          mode: compare
          fail-on: none
          summary-details: "true"
          working-directory: integrations/ci-fixture
      - name: summary-details shows everything
        env:
          SUMMARY: ${{ steps.details.outputs.summary }}
        run: |
          cat "$SUMMARY"
          # What every Echo release's Markdown report shows unmasked.
          grep -F customer@example.com "$SUMMARY"
          grep -F 'New order W-1001' "$SUMMARY"
      - name: No artifact by default
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name')
          if printf '%s\n' "$names" | grep -qE '^echo-report(-[0-9]+)?$'; then echo "::error::the report was uploaded by default"; exit 1; fi

  # A site in a subfolder with an explicit config file. Echo is then left
  # running with mode up for a later step and stopped with mode stop.
  monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the fixture into a monorepo layout
        run: |
          mkdir -p "$RUNNER_TEMP/mono/sites" && cp -r integrations/ci-fixture "$RUNNER_TEMP/mono/sites/shop"
          mv "$RUNNER_TEMP/mono" ./mono
          php -S 127.0.0.1:20510 mono/sites/shop/php/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
      - uses: ./
        id: snap
        with:
          mode: snapshot
          name: good
          working-directory: mono/sites/shop
          config: .echo/config.yaml
      - name: The snapshot is in the subfolder
        run: test -d mono/sites/shop/.echo/snapshots/good
      - uses: ./
        id: up
        with:
          mode: up
          working-directory: mono/sites/shop
      - name: A later step runs the checks
        working-directory: mono/sites/shop
        run: rhythm-echo run --plain
      - uses: ./
        id: stop
        with:
          mode: stop
          working-directory: mono/sites/shop
      - name: stop reported the run where up said
        env:
          WANT: ${{ steps.up.outputs.report }}
          GOT: ${{ steps.stop.outputs.report }}
          SUMMARY: ${{ steps.stop.outputs.summary }}
        run: |
          cat "$SUMMARY"
          test "$WANT" = "$GOT" && test -s "$GOT"
          grep -F '1 action run; 1 email sent.' "$SUMMARY"

  # Echo can't run (exit 3) and a usage error (exit 2): the step fails and
  # the job summary still says why.
  couldnt-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        id: dead
        continue-on-error: true
        with:
          working-directory: integrations/ci-fixture
          args: --url http://127.0.0.1:20519   # nothing listens there
      - uses: ./
        id: usage
        continue-on-error: true
        with:
          working-directory: integrations/ci-fixture
          mode: compare
          fail-on: sometimes
      - name: Both failed with a summary
        env:
          DEAD: ${{ steps.dead.outcome }} ${{ steps.dead.outputs.exit-code }}
          USAGE: ${{ steps.usage.outcome }} ${{ steps.usage.outputs.exit-code }}
          DEAD_SUMMARY: ${{ steps.dead.outputs.summary }}
          USAGE_SUMMARY: ${{ steps.usage.outputs.summary }}
        run: |
          test "$DEAD" = "failure 3" && test "$USAGE" = "failure 2"
          grep -F "**Echo couldn't run (exit 3).**" "$DEAD_SUMMARY"
          grep -F "The last 30 lines of echo.log" "$DEAD_SUMMARY"
          grep -F 'fail-on "sometimes": want none, broke, new or changed when comparing' "$USAGE_SUMMARY"

  # pr-comment posts one comment, then updates it. Only on pull requests
  # from this repository: a fork's token can't write.
  pr-comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: php -S 127.0.0.1:20510 integrations/ci-fixture/php/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
      - uses: ./
        with:
          mode: snapshot
          name: good
          working-directory: integrations/ci-fixture
      - run: touch integrations/ci-fixture/php/broken
      - uses: ./
        id: first
        with:
          mode: compare
          fail-on: none
          pr-comment: "true"
          working-directory: integrations/ci-fixture
      - uses: ./
        id: second
        with:
          mode: compare
          fail-on: none
          pr-comment: "true"
          working-directory: integrations/ci-fixture
      - name: One comment, with what broke, masked
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ steps.first.outputs.comment-id }}
          SECOND: ${{ steps.second.outputs.comment-id }}
        run: |
          test -n "$FIRST" && test "$FIRST" = "$SECOND"
          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$FIRST" --jq .body)
          printf '%s\n' "$body"
          grep -F '<!-- rhythm-echo comment: integrations/ci-fixture -->' <<< "$body"
          grep -F '**✗ BROKE (1)**' <<< "$body"
          grep -F '**▲ NEW (1)**' <<< "$body"
          if grep -F customer@example.com <<< "$body"; then echo "::error::the comment shows a recipient"; exit 1; fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$FIRST"
