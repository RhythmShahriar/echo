# Runs the Action (uses: ./) the way a user's workflow does, against the
# current Echo release.
name: action-test
on:
  pull_request:
    paths: [action.yml, .github/scripts/**, .github/workflows/action-test.yml, integrations/**]
  push:
    branches: [master]
    paths: [action.yml, .github/scripts/**, .github/workflows/action-test.yml, integrations/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The Action installs and verifies the release, then starts Echo.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./
        id: echo
        with:
          mode: up
      - name: Echo answers
        run: |
          rhythm-echo --version
          curl -fsS "$RHYTHM_ECHO_URL/v1/health"
          kill "$(cat "$RUNNER_TEMP/echo.pid")"

  # A release whose checksums.txt or archive changed after signing must
  # never install.
  tampered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Download the latest release
        run: |
          mkdir -p "$RUNNER_TEMP/rel" && cd "$RUNNER_TEMP/rel"
          for f in rhythm-echo_linux_amd64.tar.gz checksums.txt checksums.txt.sigstore.json; do
            curl -fsSLO "https://github.com/RhythmShahriar/echo/releases/latest/download/$f"
          done
      - name: The untouched release verifies
        run: bash .github/scripts/verify-release.sh "$RUNNER_TEMP/rel" rhythm-echo_linux_amd64.tar.gz
      - name: A changed checksums.txt fails
        run: |
          d="$RUNNER_TEMP/sums" && cp -r "$RUNNER_TEMP/rel" "$d"
          # Point the archive's line at a different archive's hash, as an
          # attacker who replaced both files would.
          sum=$(sha256sum /bin/sh | awk '{print $1}')
          awk -v s="$sum" '$2 == "rhythm-echo_linux_amd64.tar.gz" {$1 = s} {print}' "$RUNNER_TEMP/rel/checksums.txt" > "$d/checksums.txt"
          cmp -s "$RUNNER_TEMP/rel/checksums.txt" "$d/checksums.txt" && { echo "::error::the line to change is missing"; exit 1; }
          if bash .github/scripts/verify-release.sh "$d" rhythm-echo_linux_amd64.tar.gz; then
            echo "::error::a tampered checksums.txt verified"; exit 1
          fi
      - name: A changed archive fails
        run: |
          d="$RUNNER_TEMP/archive" && cp -r "$RUNNER_TEMP/rel" "$d"
          printf 'x' >> "$d/rhythm-echo_linux_amd64.tar.gz"
          if bash .github/scripts/verify-release.sh "$d" rhythm-echo_linux_amd64.tar.gz; then
            echo "::error::a tampered archive verified"; exit 1
          fi
      - name: A missing signature fails
        run: |
          d="$RUNNER_TEMP/nosig" && cp -r "$RUNNER_TEMP/rel" "$d"
          rm "$d/checksums.txt.sigstore.json"
          if bash .github/scripts/verify-release.sh "$d" rhythm-echo_linux_amd64.tar.gz; then
            echo "::error::a release without a signature verified"; exit 1
          fi

  # Upload is off by default and the summary hides who was messaged and
  # what was said, unless summary-details is on.
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # list this run's artifacts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start the fixture shop
        run: php -S 127.0.0.1:20510 integrations/ci-fixture/php/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
      - uses: ./
        with:
          mode: snapshot
          name: good
          args: --config integrations/ci-fixture/.echo/config.yaml
      - run: touch integrations/ci-fixture/php/broken
      - uses: ./
        id: masked
        with:
          mode: compare
          fail-on: none
          args: --config integrations/ci-fixture/.echo/config.yaml
      - name: The summary is masked
        env:
          SUMMARY: ${{ steps.masked.outputs.summary }}
        run: |
          cat "$SUMMARY"
          grep -F '**Something broke.**' "$SUMMARY"
          grep -F '| 1 | 1 | 0 | 0 |' "$SUMMARY"
          grep -F 'summary-details: true' "$SUMMARY"
          for private in customer@example.com 'Order W-1001 received' 'New order W-1001'; do
            if grep -F "$private" "$SUMMARY"; then echo "::error::the summary shows $private"; exit 1; fi
          done
      - uses: ./
        id: details
        with:
          mode: compare
          fail-on: none
          summary-details: "true"
          args: --config integrations/ci-fixture/.echo/config.yaml
      - name: summary-details shows everything
        env:
          SUMMARY: ${{ steps.details.outputs.summary }}
        run: |
          cat "$SUMMARY"
          grep -F 'Order W-1001 received' "$SUMMARY"
      - name: No artifact by default
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name')
          if printf '%s\n' "$names" | grep -qx echo-report; then echo "::error::the report was uploaded by default"; exit 1; fi
