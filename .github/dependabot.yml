# Keeps the pinned dependencies current. Actions are pinned by commit with
# the version in a comment; Dependabot updates both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /   # .github/workflows and the root action.yml
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /connectors/node
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: composer
    directory: /connectors/laravel
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /   # the Dockerfile's distroless base, pinned by digest
    schedule:
      interval: weekly
