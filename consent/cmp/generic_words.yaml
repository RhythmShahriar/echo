# Negation words, matched as whole words. A text that reads as Accept
# yet holds one of these is never Accept: "Don't accept all cookies"
# refuses although "accept all cookies" is its longest phrase. The usual
# negated forms are also Reject phrases below, so a plain "Ne pas
# accepter" is a Reject. No Accept phrase may hold one of these. "non"
# is left out: "Accept non-essential cookies" accepts.
negation:
  - not
  - don t
  - dont
  - never
  - nicht
  - kein
  - keine
  - niemals
  - pas
  - jamais
  - "no"
  - nunca
  - não
  - nie
  - ne
  - nu
  - nem
  - ei
  - ikke
  - inte
  - ekki
  - ní
  - niet
  - geen
  - mhux
  - değil
  - не
  - ні
  - δεν
  - όχι
  - לא
  - لا

