# The words of the generic rule (rules/generic.yaml): how a cookie
# banner nobody wrote a rule for is told apart from other pop-ups; then
# which of its buttons accepts, rejects, opens the settings or saves
# them. Everything is matched after the same normalisation: NFKC,
# lower case, accents and other combining marks dropped, zero-width and
# other format characters removed, anything not a letter or digit read
# as a space, spaces collapsed. So "Alle&nbsp;Akzeptieren",
# "ALLE AKZEPTIEREN" and "alle akzeptieren" are one phrase.
#
# A button's text is matched against every phrase of every language;
# the longest phrase found as whole words decides, so "Continuer sans
# accepter" is a Reject although it holds "accepter". A text that is
# exactly a never_choice phrase is never Accept or Reject.

# Words that make a fixed, sticky, high or modal element a cookie
# banner: the noun cookie in each language (matched anywhere in its
# text, so "cookies" and "Cookie-Einstellungen" count).
cookie_words:
  - cookie
  - piškotk
  - sīkdat
  - slapuk
  - küpsis
  - fianá
  - бисквитк
  - κουκίδ
  - çerez
  - ملفات تعريف الارتباط
  - עוגיות
  - vafrakök
  - informasjonskaps
  - eväste
  - süti
  - kolačić
  - sušen

# Consent words: enough for a banner when no ignore word is there.
consent_words:
  - consent
  - einwilligung
  - zustimmung
  - consentement
  - consenso
  - toestemming
  - zgoda
  - consentimento
  - samtycke
  - samtykke
  - suostumus
  - souhlas
  - súhlas
  - hozzájárulás
  - privatnost
  - согласие
  - згода
  - συγκατάθεση
  - موافقة
  - הסכמה

# Words of pop-ups that are not cookie banners, matched as whole words.
# A container that has one and no cookie noun is never a banner: a
# newsletter, an age gate, a login or a cart may ask for "consent" too.
