<!-- Replica of a Usercentrics page for Echo's CMP tests (v3 banner and a newsletter offer), written
     fresh from Usercentrics's public Browser UI and Web CMP documentation and
     the markup its banner carries on public pages; none of Usercentrics's code.
     Source: https://usercentrics.com/docs/web/features/custom-css/configuration/
     Captured 2026-10-26. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop with Usercentrics: v3 banner and a newsletter offer</title>
<style>
  body { font: 16px/1.5 sans-serif; margin: 0; padding: 24px; }
  .newsletter { position: fixed; top: 24px; right: 24px; z-index: 1000; width: 280px; background: #ffe; border: 1px solid #aa8; padding: 16px; }
</style>
</head>
<body>
<h1>Corner Shop</h1>
<p>Hand-made goods, shipped from a small workshop.</p>
<div class="newsletter" role="dialog" aria-label="Newsletter">
  <p>Get 10% off your first order.</p>
  <button id="newsletter-accept">Accept offer</button>
  <button class="newsletter-close">No thanks</button>
</div>
<aside id="usercentrics-cmp-ui" data-nosnippet="true"></aside>
<template id="replica-banner">
<style>
  .replica-dialog { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483647; background: #fff; border-top: 2px solid #0045a5;
    padding: 16px 24px; font: 15px/1.5 sans-serif; box-shadow: 0 -4px 16px rgba(0,0,0,.2); }
  .replica-second { display: none; }
  button { margin: 4px 8px 4px 0; padding: 8px 16px; font-size: 15px; }
</style>
<div class="replica-dialog first gdpr ltr" id="uc-main-dialog" role="dialog" aria-label="Privacy Settings">
  <p id="uc-privacy-description">We use cookies and similar technologies on our website. You can change your choice at any time in the privacy settings.</p>
  <div class="replica-second" id="uc-tabs-header">
    <label><input type="checkbox" class="uc-toggle" data-service="H1Vl5NidjWX" checked disabled> Usercentrics Consent Management Platform</label><br>
    <label><input type="checkbox" class="uc-toggle" id="uc-service-HkocEodjb7-toggle" data-service="HkocEodjb7"> Google Analytics</label><br>
    <label><input type="checkbox" class="uc-toggle" id="uc-service-ko1w5PpFl-toggle" data-service="ko1w5PpFl"> Facebook Pixel</label><br>
    <button id="save">Save</button>
  </div>
  <div>
    <button id="more">More Information</button>
    <button id="deny">Deny</button>
    <button id="accept">Accept All</button>
  </div>
</div>
</template>
<script id="usercentrics-cmp" src="web.cmp.usercentrics.eu/ui/loader.js" data-settings-id="replica" data-show="now"></script>
</body>
</html>
