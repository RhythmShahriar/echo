# What Echo should see on each iubenda replica page (format in
# ../README.md). found, present, banner_after_ms, detected_by and the
# layers are checked in a real browser by the testbed's X8; sees answers
# the FakeTab tests of consent/cmp.
cmp: iubenda
pages:
  - page: first-layer.html
    found: true
    present: true
    detected_by: "selector:#iubenda-cs-banner and global:_iub"
    accept_layer: 1
    reject_layer: 1
    sees:
      selectors: ["#iubenda-cs-banner"]
      globals: [_iub]
      scripts: [cdn.iubenda.com]
      banner: true
      controls: [".iubenda-cs-accept-btn", ".iubenda-cs-reject-btn", ".iubenda-cs-customize-btn"]
  - page: second-layer.html
    found: true
    present: true
    detected_by: "selector:#iubenda-cs-banner and global:_iub"
    accept_layer: 1
    reject_layer: 2
    sees:
      selectors: ["#iubenda-cs-banner"]
      globals: [_iub]
      scripts: [cdn.iubenda.com]
      banner: true
      controls: [".iubenda-cs-accept-btn", ".iubenda-cs-customize-btn"]
      settings: ["#iubenda-iframe .iubenda-cs-save-btn"]
      toggles: [false, false, false, false]
  - page: hidden.html
    found: false
    present: true
    detected_by: "selector:#iubenda-cs-banner and global:_iub"
    sees:
      selectors: ["#iubenda-cs-banner"]
      globals: [_iub]
      scripts: [cdn.iubenda.com]
  - page: late.html
    found: true
    present: true
    banner_after_ms: 4000
    detected_by: "selector:#iubenda-cs-banner and global:_iub"
    accept_layer: 1
    reject_layer: 1
    sees:
      selectors: ["#iubenda-cs-banner"]
      globals: [_iub]
      scripts: [cdn.iubenda.com]
      banner: true
      controls: [".iubenda-cs-accept-btn", ".iubenda-cs-reject-btn", ".iubenda-cs-customize-btn"]
  - page: two-banners.html
    found: true
    present: true
    detected_by: "selector:#iubenda-cs-banner and global:_iub"
    accept_layer: 1
    reject_layer: 1
    sees:
      selectors: ["#iubenda-cs-banner"]
      globals: [_iub]
      scripts: [cdn.iubenda.com]
      banner: true
      controls: [".iubenda-cs-accept-btn", ".iubenda-cs-reject-btn", ".iubenda-cs-customize-btn"]
      decoys: ["#newsletter-accept", ".newsletter-close"]
  - page: text-only.html
    found: false
    present: false
  - page: script-no-banner.html
    found: false
    present: true
    detected_by: "global:_iub and script:cdn.iubenda.com"
    sees:
      globals: [_iub]
      scripts: [cdn.iubenda.com]
  - page: floating.html
    found: true
    present: true
    detected_by: "selector:#iubenda-cs-banner and global:_iub"
    accept_layer: 1
    reject_layer: 2
    sees:
      selectors: ["#iubenda-cs-banner"]
      globals: [_iub]
      scripts: [cdn.iubenda.com]
      banner: true
      controls: [".iubenda-cs-accept-btn", ".iubenda-cs-customize-btn"]
      settings: ["#iubenda-iframe .iubenda-cs-save-btn"]
      toggles: [false, false, false, false]
      decoys: [".iubenda-cs-close-btn"]
