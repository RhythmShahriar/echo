<!-- Hand-made page for Echo's generic rule tests (an age gate that mentions cookies): no vendor's
     markup or code. Written 2026-10-26. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Shop: an age gate that mentions cookies</title>
<style>
  body { font: 16px/1.5 sans-serif; margin: 0; padding: 24px; }
  [hidden] { display: none !important; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; background: #fff; border-top: 2px solid #333;
    padding: 16px 24px; box-shadow: 0 -4px 16px rgba(0,0,0,.2); }
  .modal { position: fixed; top: 15%; left: 20%; right: 20%; z-index: 10000; background: #fff; border: 1px solid #333; padding: 16px; }
  .bar button, .modal button, .bar a.btn { margin: 4px 8px 4px 0; padding: 8px 16px; font-size: 15px; }
  .widget { position: fixed; right: 24px; bottom: 24px; width: 300px; z-index: 5000; background: #fff; border: 1px solid #333; padding: 16px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; z-index: 5000; background: #fff; border-left: 1px solid #333; padding: 16px; }
  .top { position: sticky; top: 0; z-index: 10; background: #ffd; padding: 8px 24px; }
</style>
</head>
<body>
<h1>Corner Shop</h1>
<p>Hand-made goods, shipped from a small workshop.</p>
<div class="modal" role="dialog" aria-modal="true" aria-label="Age check">
  <p>You must be over 18 to enter this shop. We set a cookie to remember your answer.</p>
  <button type="button">I am over 18</button>
  <button type="button">Accept</button>
  <button type="button">Leave</button>
</div>
</body>
</html>
