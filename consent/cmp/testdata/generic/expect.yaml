# What Echo should see on each generic page (format in ../README.md).
# accept_text and reject_text are the controls Find reports (for a
# Reject in the settings, the button that opens them); reject_reason is
# set when the Reject can't be verified. sees.generic is what the
# generic script reports, for the FakeTab tests. The lang-<code>.html
# rows at the end are written by TestGenericLanguagePages
# (go test ./consent/cmp -run TestGenericLanguagePages -update).
cmp: generic
pages:
  - page: english.html
    found: true
    present: true
    detected_by: "generic"
    accept_layer: 1
    reject_layer: 1
    accept_text: "Accept all"
    reject_text: "Reject all"
    sees:
      generic:
        cookie: true
        consent: true
        buttons: ["Cookie settings", "Reject all", "Accept all"]
        links: ["Privacy policy"]
        settings: ["Save my choices"]
        toggles: [false, false]
  - page: settings-layer.html
    found: true
    present: true
    detected_by: "generic"
    accept_layer: 1
    reject_layer: 2
    accept_text: "Alle akzeptieren"
    reject_text: "Einstellungen"
    sees:
      generic:
        cookie: true
        consent: true
        buttons: ["Einstellungen", "Alle akzeptieren"]
        settings: ["Auswahl speichern"]
        toggles: [true, true]
  - page: rtl-ar.html
