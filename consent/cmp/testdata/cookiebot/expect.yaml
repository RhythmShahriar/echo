# What Echo should see on each Cookiebot replica page (format in
# ../README.md). found, present, banner_after_ms, detected_by and the
# layers are checked in a real browser by the testbed's X8; sees answers
# the FakeTab tests of consent/cmp.
cmp: cookiebot
pages:
  - page: first-layer.html
    found: true
    present: true
    detected_by: "selector:#CybotCookiebotDialog and global:Cookiebot"
    accept_layer: 1
    reject_layer: 1
    sees:
      selectors: ["#CybotCookiebotDialog"]
      globals: [Cookiebot]
      scripts: [consent.cookiebot.com/uc.js]
      banner: true
      controls: ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll", "#CybotCookiebotDialogBodyButtonDecline", "#CybotCookiebotDialogBodyLevelButtonCustomize"]
  - page: second-layer.html
    found: true
    present: true
    detected_by: "selector:#CybotCookiebotDialog and global:Cookiebot"
    accept_layer: 1
    reject_layer: 2
    sees:
      selectors: ["#CybotCookiebotDialog"]
      globals: [Cookiebot]
      scripts: [consent.cookiebot.com/uc.js]
      banner: true
      controls: ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll", "#CybotCookiebotDialogBodyLevelButtonCustomize"]
      settings: ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowallSelection"]
      toggles: [false, false, false]
  - page: hidden.html
    found: false
    present: true
    detected_by: "selector:#CybotCookiebotDialog and global:Cookiebot"
    sees:
      selectors: ["#CybotCookiebotDialog"]
      globals: [Cookiebot]
      scripts: [consent.cookiebot.com/uc.js]
  - page: late.html
    found: true
    present: true
    banner_after_ms: 4000
    detected_by: "selector:#CybotCookiebotDialog and global:Cookiebot"
    accept_layer: 1
    reject_layer: 1
    sees:
      selectors: ["#CybotCookiebotDialog"]
      globals: [Cookiebot]
      scripts: [consent.cookiebot.com/uc.js]
      banner: true
      controls: ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll", "#CybotCookiebotDialogBodyButtonDecline", "#CybotCookiebotDialogBodyLevelButtonCustomize"]
  - page: two-banners.html
    found: true
    present: true
    detected_by: "selector:#CybotCookiebotDialog and global:Cookiebot"
    accept_layer: 1
    reject_layer: 1
    sees:
      selectors: ["#CybotCookiebotDialog"]
      globals: [Cookiebot]
      scripts: [consent.cookiebot.com/uc.js]
      banner: true
      controls: ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll", "#CybotCookiebotDialogBodyButtonDecline", "#CybotCookiebotDialogBodyLevelButtonCustomize"]
      decoys: ["#newsletter-accept", ".newsletter-close"]
  - page: text-only.html
    found: false
    present: false
  - page: script-no-banner.html
    found: false
    present: true
    detected_by: "global:Cookiebot and script:consent.cookiebot.com/uc.js"
    sees:
      globals: [Cookiebot]
      scripts: [consent.cookiebot.com/uc.js]
  - page: details-tab.html
    found: true
    present: true
    detected_by: "selector:#CybotCookiebotDialog and global:Cookiebot"
    accept_layer: 1
    reject_layer: 2
    sees:
      selectors: ["#CybotCookiebotDialog"]
      globals: [Cookiebot]
      scripts: [consent.cookiebot.com/uc.js]
      banner: true
      controls: ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll", "#CybotCookiebotDialogNavDetails"]
      settings: ["#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowallSelection"]
      toggles: [false, true, true]
