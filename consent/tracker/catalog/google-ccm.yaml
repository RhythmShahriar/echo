# The Google tag's consolidated measurement endpoint
# (www.google.com/ccm/collect), sent alongside Google Ads conversions.
id: google-ccm
name: Google tag measurement (ccm)
vendor: Google
category: advertising
consent: needed
hits:
  - hosts: [www.google.com]
    paths: [/ccm/collect]
    methods: [GET, POST]
params:
  event: [en]
  id: [tid]
fix: Set a Consent Mode default (all four signals denied) before the Google tag, or let the banner block it until consent.
docs: https://developers.google.com/tag-platform/security/guides/csp
sources:
  - https://developers.google.com/tag-platform/security/guides/csp
  - https://developers.google.com/tag-platform/security/guides/consent
