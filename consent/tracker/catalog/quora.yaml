# Quora Pixel. The pixel ID is the path segment after /_/ad/.
id: quora
name: Quora Pixel
vendor: Quora
category: advertising
consent: needed
hits:
  - hosts: [q.quora.com]
    paths: [/_/ad/**]
scripts:
  - hosts: [a.quora.com]
    paths: [/qevents.js]
params:
  event: [tag]
  id_path: '^/_/ad/([0-9a-f]+)'
fix: Load the Quora Pixel only after the banner reports marketing consent
docs: https://quoraadsupport.zendesk.com/hc/en-us/articles/115010466208-How-do-I-install-the-Quora-pixel
sources:
  - https://quoraadsupport.zendesk.com/hc/en-us/articles/115010466208-How-do-I-install-the-Quora-pixel
