# Google Ads remarketing audiences (user lists).
id: google-remarketing
name: Google Ads remarketing
vendor: Google
category: advertising
consent: needed
hits:
  - hosts: [www.google.com]
    paths: ["/pagead/1p-user-list/*"]
params:
  id_path: '^/pagead/1p-user-list/([0-9]+)'
fix: Set a Consent Mode default (all four signals denied) before the Google tag, or let the banner block remarketing until consent.
docs: https://developers.google.com/tag-platform/security/guides/csp
sources:
  - https://developers.google.com/tag-platform/security/guides/csp
  - https://business.safety.google/adscookies/
