# Reverse proxy into the sealed network. It forwards to the app only.
server {
    listen 80;
    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass Echo's action tag through, so messages link to the action.
        proxy_set_header X-Echo-Run $http_x_echo_run;
    }
}
