; Route a php-fpm pool through Echo. php-fpm clears the environment of
; its workers (clear_env = yes), so container or systemd variables never
; reach PHP; env[] sets them for the pool. libcurl reads the proxy
; variables itself, so this covers SDKs that call cURL directly (Twilio,
; Stripe, AWS) as well as WordPress and Guzzle.
;
; Install: /usr/local/etc/php-fpm.d/zz-echo.conf (official Docker images)
;      or: /etc/php/8.3/fpm/pool.d/zz-echo.conf (Debian, Ubuntu)
; then reload php-fpm. The section name must match your pool ([www]).
; Replace ECHO_TOKEN, or drop "echo:ECHO_TOKEN@" when Echo listens on
; loopback without a token. Never install this on production.

[www]
; HTTPS clients (libcurl reads both spellings).
env[https_proxy] = http://echo:ECHO_TOKEN@127.0.0.1:8026
env[HTTPS_PROXY] = http://echo:ECHO_TOKEN@127.0.0.1:8026
; Plain HTTP: lowercase only. libcurl never reads HTTP_PROXY, because
; under CGI a request header can set it (httpoxy).
env[http_proxy] = http://echo:ECHO_TOKEN@127.0.0.1:8026
env[no_proxy] = localhost,127.0.0.1,::1
env[NO_PROXY] = localhost,127.0.0.1,::1

; For the Echo connectors and the sendmail shim.
env[RHYTHM_ECHO_URL] = http://127.0.0.1:8025
env[RHYTHM_ECHO_SMTP] = 127.0.0.1:1025
env[RHYTHM_ECHO_TOKEN] = ECHO_TOKEN

; mail() goes to Echo. -t takes recipients from the headers, -i keeps
; lines holding a single dot.
php_admin_value[sendmail_path] = "/usr/local/bin/rhythm-echo sendmail -t -i"

; Trust Echo's CA for cURL and streams that use PHP's defaults. Use a
; bundle (the system CAs plus Echo's): allowed hosts are tunnelled to the
; real server and present its real certificate.
;   cat /etc/ssl/certs/ca-certificates.crt "$(rhythm echo ca)" > /etc/rhythm-echo/bundle.pem
php_admin_value[curl.cainfo] = /etc/rhythm-echo/bundle.pem
php_admin_value[openssl.cafile] = /etc/rhythm-echo/bundle.pem
